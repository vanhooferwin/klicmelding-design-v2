name: Deploy

# Op main: zelfde tests als CI, dan image pushen en — na goedkeuring — naar productie.
on:
  push:
    branches: [ main ]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test --if-present

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klic
          POSTGRES_PASSWORD: test
          POSTGRES_DB: klicmelding_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U klic" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://klic:test@localhost:5432/klicmelding_test
      AUTH_SECRET: test-secret-please-override
      AUTH_URL: http://localhost:3000
      MAILJET_API_KEY: test
      MAILJET_API_SECRET: test
      MAIL_FROM: "Test <info@klicmelding.nl>"
      OMNIKASSA_BASE_URL: https://sandbox.example/omnikassa
      PDOK_BASE_URL: https://api.pdok.nl/bzk/locatieserver/search/v3_1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run db:migrate
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with: { name: playwright-report, path: playwright-report/ }

  build-push:
    name: Build & push image
    needs: [ quality, e2e ]          # tests zijn een harde poort
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    name: Deploy naar productie
    needs: [ build-push ]
    runs-on: ubuntu-latest
    environment: production          # vereist handmatige goedkeuring (zie BUILD.md)
    steps:
      - name: Deploy via SSH naar VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/klicmelding
            docker compose pull
            docker compose up -d
            docker compose run --rm web npm run db:migrate
